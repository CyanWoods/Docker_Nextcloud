name: CI

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 无上游变更也强制构建
        type: boolean
        default: false
      no_cache:
        description: 禁用构建缓存（--no-cache）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.new.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record current version
        id: old
        run: |
          OLD=$(cat nextcloud/latest.txt)
          echo "version=$OLD" >> $GITHUB_OUTPUT

      - name: Pull submodule upstream
        run: |
          cd nextcloud
          git checkout master
          git pull
          cd ..

      - name: Read new version
        id: new
        run: |
          NEW=$(cat nextcloud/latest.txt)
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.old.outputs.version }}" = "${{ steps.new.outputs.version }}" ]; then
            echo "No version change: ${{ steps.old.outputs.version }}"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed: ${{ steps.old.outputs.version }} -> ${{ steps.new.outputs.version }}"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push submodule update
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.email "gitea-actions@local"
          git config user.name "Gitea Actions"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@self.cyanwoods.com:51101/CyanWoods/Docker_Nextcloud"
          git add nextcloud
          git commit -m "Update# nextcloud submodule - 升级至 ${{ steps.new.outputs.version }}"
          git push

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          MAJOR=$(cut -d. -f1 nextcloud/latest.txt)
          chmod +x buildx.sh
          extra=""
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            extra="--no-cache"
          fi
          ./buildx.sh "$MAJOR" linux/amd64,linux/arm64 $extra
